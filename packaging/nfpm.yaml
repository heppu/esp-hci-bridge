name: hcibridge
arch: ${PKG_ARCH}
version: ${VERSION}
version_schema: none
maintainer: Henri Koski <henri.koski@bitbrewers.fi>
description: |
  Attach remote ESP32 Bluetooth bridges to the local Bluetooth stack.
  Discovers ESP HCI bridges on the LAN and gives each its own adapter.
vendor: heppu
homepage: https://github.com/heppu/esp-hci-bridge
license: MIT

# Per-file `packager:` selects a format; entries without it go to every format.
# (Do not use per-format `overrides.contents` — it replaces this whole list.)
contents:
  - src: dist/hcibridge
    dst: /usr/bin/hcibridge
    file_info:
      mode: 0755
  - src: zig-out/gen/hcibridge.bash
    dst: /usr/share/bash-completion/completions/hcibridge
  - src: zig-out/gen/_hcibridge
    dst: /usr/share/zsh/site-functions/_hcibridge
  - src: zig-out/gen/hcibridge.fish
    dst: /usr/share/fish/vendor_completions.d/hcibridge.fish
  - src: zig-out/gen/hcibridge.1
    dst: /usr/share/man/man1/hcibridge.1
  - src: host/config/config
    dst: /etc/hcibridge/config
    type: config|noreplace
  - src: host/config/config.d/50-example.conf
    dst: /etc/hcibridge/config.d/50-example.conf
    type: config|noreplace
  - src: host/modules-load.conf
    dst: /usr/lib/modules-load.d/hci_vhci.conf

  # systemd (deb, rpm)
  - src: host/systemd/hcibridge.service
    dst: /usr/lib/systemd/system/hcibridge.service
    packager: deb
  - src: host/systemd/hcibridge.env
    dst: /etc/default/hcibridge
    type: config|noreplace
    packager: deb
  - src: host/systemd/hcibridge.service
    dst: /usr/lib/systemd/system/hcibridge.service
    packager: rpm
  - src: host/systemd/hcibridge.env
    dst: /etc/default/hcibridge
    type: config|noreplace
    packager: rpm

  # OpenRC (apk)
  - src: host/openrc/hcibridged
    dst: /etc/init.d/hcibridged
    file_info:
      mode: 0755
    packager: apk
  - src: host/openrc/hcibridged.confd
    dst: /etc/conf.d/hcibridged
    type: config|noreplace
    packager: apk

overrides:
  deb:
    depends: [bluez]
    scripts:
      postinstall: packaging/systemd-postinstall.sh
      preremove: packaging/systemd-preremove.sh
  rpm:
    depends: [bluez]
    scripts:
      postinstall: packaging/systemd-postinstall.sh
      preremove: packaging/systemd-preremove.sh
  apk:
    depends: [bluez, bluez-openrc]
    scripts:
      postinstall: packaging/openrc-postinstall.sh
      preremove: packaging/openrc-preremove.sh
    apk:
      scripts:
        postupgrade: packaging/openrc-postinstall.sh
