# /etc/hcibridge/hcibridge.conf - main configuration for the hcibridge daemon.
#
# Every setting can also be given as an environment variable or a CLI flag.
# Precedence (highest first):  flag  >  env  >  this file (+ .d)  >  default
#
# Drop-in fragments in /etc/hcibridge/hcibridge.conf.d/*.conf are merged on top of this
# file, sorted by name. Scalars are last-wins, lists (client/allow/deny/psk) add up.
#
# Format: key = value   ('#' or ';' begins a comment, also after a value)
# Unknown keys and values that do not parse are logged and ignored.

# Auto-discover boards on the LAN.            env HCIBRIDGE_DISCOVERY
# discovery = on

# Address to listen on for discovery.         env HCIBRIDGE_BIND
# bind = 0.0.0.0

# Only attach boards whose IP is in range.    env HCIBRIDGE_SUBNET
# subnet = 172.16.0.0/16

# UDP discovery port.                         env HCIBRIDGE_DISCOVERY_PORT
# discovery-port = 4445

# Default board TCP port.                     env HCIBRIDGE_PORT
# port = 4444

# Virtual HCI device.                         env HCIBRIDGE_VHCI
# vhci = /dev/vhci

# Reconnect delay for pinned boards (ms).     env HCIBRIDGE_RECONNECT_MS
# reconnect-ms = 1000

# Static ESP boards to attach (one per line, repeatable). env HCIBRIDGE_CLIENTS (comma-separated)
# client = 172.16.135.242
# client = 172.16.135.243:4444

# Attach only these boards by Bluetooth address (allowlist). env HCIBRIDGE_ALLOW
# allow = a0:a3:b3:2f:61:1e

# Never attach these boards (deny wins).      env HCIBRIDGE_DENY
# deny = aa:bb:cc:dd:ee:ff

# Board keys. 'hcibridge claim <ip>' pairs a board with this PC and writes one
# of these to hcibridge.conf.d/board-<bdaddr>.conf (mode 0600). A board without a key
# here is never attached. The last entry for a board wins.
# env HCIBRIDGE_PSK (comma-separated)
# psk = a0:a3:b3:2f:61:1e=0123...cdef
