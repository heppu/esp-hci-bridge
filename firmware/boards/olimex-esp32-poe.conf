# Olimex ESP32-POE / ESP32-POE-ISO: LAN8710, ESP32 outputs RMII clock on GPIO17.
# Hardware-verified.
CONFIG_BRIDGE_BOARD_ID="olimex-esp32-poe"
CONFIG_BRIDGE_NET_WIFI=n
CONFIG_BRIDGE_ETH_PHY_LAN87XX=y
CONFIG_BRIDGE_ETH_MDC_GPIO=23
CONFIG_BRIDGE_ETH_MDIO_GPIO=18
CONFIG_BRIDGE_ETH_PHY_POWER_GPIO=12
CONFIG_BRIDGE_ETH_PHY_ADDR=0
CONFIG_BRIDGE_ETH_CLK_IN=n
CONFIG_BRIDGE_ETH_CLK_GPIO=17
CONFIG_ETH_RMII_CLK_OUTPUT=y
CONFIG_ETH_RMII_CLK_OUT_GPIO=17
