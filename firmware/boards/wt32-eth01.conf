# Wireless-Tag WT32-ETH01: LAN8720, external 50 MHz clock into GPIO0, PHY power GPIO16, address 1.
# Not yet hardware-verified.
CONFIG_BRIDGE_BOARD_ID="wt32-eth01"
CONFIG_BRIDGE_NET_WIFI=n
CONFIG_BRIDGE_ETH_PHY_LAN87XX=y
CONFIG_BRIDGE_ETH_MDC_GPIO=23
CONFIG_BRIDGE_ETH_MDIO_GPIO=18
CONFIG_BRIDGE_ETH_PHY_POWER_GPIO=16
CONFIG_BRIDGE_ETH_PHY_ADDR=1
CONFIG_BRIDGE_ETH_CLK_IN=y
CONFIG_BRIDGE_ETH_CLK_GPIO=0
CONFIG_ETH_RMII_CLK_INPUT=y
CONFIG_ETH_RMII_CLK_IN_GPIO=0
