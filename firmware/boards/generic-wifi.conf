# Any ESP32 with WiFi (devkits, NodeMCU-32, etc.). No Ethernet.
# With no baked-in SSID the board starts a setup portal:
# join "esp-hci-bridge-setup" and open http://192.168.4.1/
CONFIG_BRIDGE_NET_WIFI=y
CONFIG_BRIDGE_WIFI_SSID=""
CONFIG_BRIDGE_WIFI_PASS=""
# WiFi + dual-mode Bluetooth overflow IRAM on the original ESP32. Keep WiFi's
# hot paths in flash; HCI traffic is tiny so the throughput cost is irrelevant.
CONFIG_ESP_WIFI_IRAM_OPT=n
CONFIG_ESP_WIFI_RX_IRAM_OPT=n
