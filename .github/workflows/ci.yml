name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.f.outputs.firmware }}
      packaging: ${{ steps.f.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: f
        with:
          filters: |
            firmware:
              - 'firmware/**'
              - 'common/**'
              - 'scripts/firmware.sh'
              - '.github/workflows/ci.yml'
            packaging:
              - 'packaging/**'
              - 'host/systemd/**'
              - 'host/openrc/**'
              - 'host/runit/**'
              - 'host/config/**'
              - '.github/workflows/ci.yml'

  host:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig common host firmware/main
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseSafe -Dversion=v99.0.0
      - run: zig build release
      - run: zig build gen
      - name: Check generated completions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y zsh fish
          bash -n zig-out/gen/hcibridge.bash
          zsh -n zig-out/gen/_hcibridge
          fish --no-execute zig-out/gen/hcibridge.fish
      - name: Package smoke test (deb/rpm/apk)
        run: |
          NV=2.44.0
          curl -sSL -o nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NV}/nfpm_${NV}_Linux_x86_64.tar.gz"
          echo "1a12d47f104bdd5953d33bb1e97b369ffade9c429bfc070fd19977844100d3d2  nfpm.tgz" | sha256sum -c -
          tar xzf nfpm.tgz nfpm && rm nfpm.tgz
          mkdir -p dist && cp zig-out/bin/hcibridge dist/hcibridge
          openssl genrsa -out packaging/keys/heppu-hcibridge.rsa 2048 2>/dev/null
          openssl rsa -in packaging/keys/heppu-hcibridge.rsa -pubout -out packaging/keys/heppu-hcibridge.rsa.pub 2>/dev/null
          gpg --batch --quick-gen-key --passphrase '' ci@example.invalid rsa2048 sign 0 2>/dev/null
          gpg --batch --armor --export-secret-keys ci@example.invalid > packaging/keys/hcibridge.gpg
          gpg --batch --armor --export ci@example.invalid > packaging/keys/hcibridge.gpg.pub
          mkdir -p pkgs
          PKG_ARCH=amd64 VERSION=99.0.0 ./nfpm pkg -f packaging/nfpm.yaml -p deb -t pkgs/
          PKG_ARCH=x86_64 VERSION=99.0.0 ./nfpm pkg -f packaging/nfpm.yaml -p rpm -t pkgs/
          PKG_ARCH=x86_64 VERSION=99.0.0 ./nfpm pkg -f packaging/nfpm.yaml -p apk -t pkgs/
          ls -1 pkgs
      # Only when packaging changed: build the three repositories with the
      # throwaway keys and install from them, service start included.
      - name: Repositories and installs in containers
        if: needs.changes.outputs.packaging == 'true'
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y dpkg-dev apt-utils createrepo-c gnupg >/dev/null
          packaging/make-repos.sh pkgs repo packaging/keys
          packaging/verify-repos.sh repo v99.0.0

  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/zig-xtensa
          key: zig-xtensa-0.16.0-xtensa-9e3dcef9
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('firmware/sdkconfig.defaults', 'firmware/boards/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ hashFiles('firmware/sdkconfig.defaults', 'firmware/boards/**') }}-
            ccache-
      - name: Fetch Espressif Zig
        run: |
          [ -x .tools/zig-xtensa/zig ] && exit 0
          mkdir -p .tools/zig-xtensa
          curl -sSL -o zig-xtensa.tar.xz https://github.com/kassane/zig-espressif-bootstrap/releases/download/0.16.0-xtensa/zig-relsafe-x86_64-linux-musl-baseline.tar.xz
          echo "9e3dcef9d6f6d552df641a12addc9e443a69b7cbdad85492ec677acd55b7de9b  zig-xtensa.tar.xz" | sha256sum -c -
          tar -xJ -C .tools/zig-xtensa --strip-components=1 -f zig-xtensa.tar.xz && rm zig-xtensa.tar.xz
      - name: Signing key
        shell: bash
        env:
          KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > secure_boot_signing_key.pem
          else espsecure.py generate_signing_key --version 1 secure_boot_signing_key.pem; fi
      - name: Build all presets
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          export ZIG="$PWD/.tools/zig-xtensa/zig"
          cd firmware
          for b in boards/*.conf; do
            b=$(basename "$b" .conf)
            idf.py -B "build-$b" -DSDKCONFIG="build-$b/sdkconfig" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/$b.conf" build
            espsecure.py verify_signature --version 1 --keyfile secure_boot_signing_key.pem "build-$b/hcibridge.bin"
          done
          ccache -s | head -6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: |
            firmware/build-*/hcibridge.bin
            firmware/build-*/flash_args
