name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig common host firmware/main
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseSafe
      - run: zig build release
      - run: zig build gen
      - name: Package smoke test (deb/rpm/apk)
        run: |
          NV=2.44.0
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NV}/nfpm_${NV}_Linux_x86_64.tar.gz" | tar xz nfpm
          mkdir -p dist && cp zig-out/bin/hcibridge dist/hcibridge
          for fmt in deb rpm apk; do PKG_ARCH=amd64 VERSION=0.0.0 ./nfpm pkg -f packaging/nfpm.yaml -p $fmt -t .; done
          ls -1 *.deb *.rpm *.apk

  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Espressif Zig
        run: |
          mkdir -p .tools/zig-xtensa
          curl -sSL https://github.com/kassane/zig-espressif-bootstrap/releases/download/0.16.0-xtensa/zig-relsafe-x86_64-linux-musl-baseline.tar.xz \
            | tar -xJ -C .tools/zig-xtensa --strip-components=1
      - name: Build (olimex-esp32-poe + generic-wifi)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          export ZIG="$PWD/.tools/zig-xtensa/zig"
          cd firmware
          for b in olimex-esp32-poe generic-wifi; do
            idf.py -B "build-$b" -DSDKCONFIG="build-$b/sdkconfig" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/$b.conf" build
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build-*/esp-hci-bridge.bin
            firmware/build-*/flash_args
