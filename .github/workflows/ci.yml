name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.f.outputs.firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: f
        with:
          filters: |
            firmware:
              - 'firmware/**'
              - 'common/**'
              - 'scripts/firmware.sh'
              - '.github/workflows/ci.yml'

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig common host firmware/main
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseSafe
      - run: zig build release
      - run: zig build gen
      - name: Check generated completions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y zsh fish
          bash -n zig-out/gen/hcibridge.bash
          zsh -n zig-out/gen/_hcibridge
          fish --no-execute zig-out/gen/hcibridge.fish
      - name: Package smoke test (deb/rpm/apk)
        run: |
          NV=2.44.0
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NV}/nfpm_${NV}_Linux_x86_64.tar.gz" | tar xz nfpm
          mkdir -p dist && cp zig-out/bin/hcibridge dist/hcibridge
          for fmt in deb rpm apk; do PKG_ARCH=amd64 VERSION=0.0.0 ./nfpm pkg -f packaging/nfpm.yaml -p $fmt -t .; done
          ls -1 *.deb *.rpm *.apk

  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/zig-xtensa
          key: zig-xtensa-0.16.0-xtensa
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('firmware/sdkconfig.defaults', 'firmware/boards/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ hashFiles('firmware/sdkconfig.defaults', 'firmware/boards/**') }}-
            ccache-
      - name: Fetch Espressif Zig
        run: |
          [ -x .tools/zig-xtensa/zig ] && exit 0
          mkdir -p .tools/zig-xtensa
          curl -sSL https://github.com/kassane/zig-espressif-bootstrap/releases/download/0.16.0-xtensa/zig-relsafe-x86_64-linux-musl-baseline.tar.xz \
            | tar -xJ -C .tools/zig-xtensa --strip-components=1
      - name: Signing key
        shell: bash
        env:
          KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > secure_boot_signing_key.pem
          else espsecure.py generate_signing_key --version 1 secure_boot_signing_key.pem; fi
      - name: Build all presets
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          export ZIG="$PWD/.tools/zig-xtensa/zig"
          cd firmware
          for b in boards/*.conf; do
            b=$(basename "$b" .conf)
            idf.py -B "build-$b" -DSDKCONFIG="build-$b/sdkconfig" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/$b.conf" build
            espsecure.py verify_signature --version 1 --keyfile secure_boot_signing_key.pem "build-$b/esp-hci-bridge.bin"
          done
          ccache -s | head -6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: |
            firmware/build-*/esp-hci-bridge.bin
            firmware/build-*/flash_args
