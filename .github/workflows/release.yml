name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Espressif Zig
        run: |
          mkdir -p .tools/zig-xtensa
          curl -sSL https://github.com/kassane/zig-espressif-bootstrap/releases/download/0.16.0-xtensa/zig-relsafe-x86_64-linux-musl-baseline.tar.xz \
            | tar -xJ -C .tools/zig-xtensa --strip-components=1
      - name: Build
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          export ZIG="$PWD/.tools/zig-xtensa/zig"
          export PROJECT_VER="${GITHUB_REF_NAME}"
          cd firmware && idf.py build
      - name: Assemble site
        run: scripts/make-site.sh "${GITHUB_REF_NAME}" firmware/build _site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - run: zig build release -Dversion="${GITHUB_REF_NAME}"
      - name: Generate man page and completions
        run: zig build gen -Dversion="${GITHUB_REF_NAME}"
      - name: Install nfpm
        run: |
          NV=2.44.0
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NV}/nfpm_${NV}_Linux_x86_64.tar.gz" | tar xz nfpm
          sudo install nfpm /usr/local/bin/nfpm
      - name: Build packages and metadata
        run: |
          set -eu
          mkdir -p out
          VER="${GITHUB_REF_NAME#v}"
          export VERSION="$VER"
          cp zig-out/x86_64-linux-musl/hcibridge   out/hcibridge-x86_64-linux
          cp zig-out/aarch64-linux-musl/hcibridge  out/hcibridge-aarch64-linux
          cp zig-out/arm-linux-musleabihf/hcibridge out/hcibridge-armv7-linux
          cp zig-out/gen/hcibridge.1 zig-out/gen/hcibridge.bash zig-out/gen/_hcibridge zig-out/gen/hcibridge.fish out/
          # deb/rpm/apk for each arch from the one nfpm config
          set -- "x86_64-linux-musl amd64" "aarch64-linux-musl arm64" "arm-linux-musleabihf arm7"
          for pair in "$@"; do
            triple=${pair% *}; arch=${pair#* }
            for fmt in deb rpm apk; do
              BIN="zig-out/$triple/hcibridge" PKG_ARCH="$arch" nfpm pkg -f packaging/nfpm.yaml -p "$fmt" -t out/
            done
          done
          # AUR PKGBUILD and Alpine APKBUILD with version + source checksum
          SHA=$(curl -sL "https://github.com/heppu/esp-hci-bridge/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -e "s/@PKGVER@/$VER/" -e "s/@SHA256@/$SHA/" packaging/PKGBUILD.tmpl > out/PKGBUILD
          sed -e "s/@PKGVER@/$VER/" packaging/APKBUILD.tmpl > out/APKBUILD
          sed -e "s/@PKGVER@/$VER/" -e "s/@SHA256@/$SHA/" packaging/void-template.tmpl > out/void-template
          ls -1 out/
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/

  release:
    needs: [firmware, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli
      - name: Package
        run: |
          cp _site/firmware/*.bin _site/manifest.json .
          chmod +x cli/hcibridge-*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bootloader.bin
            partition-table.bin
            esp-hci-bridge.bin
            manifest.json
            cli/hcibridge-x86_64-linux
            cli/hcibridge-aarch64-linux
            cli/hcibridge-armv7-linux
            cli/hcibridge.1
            cli/hcibridge.bash
            cli/_hcibridge
            cli/hcibridge.fish
            cli/*.deb
            cli/*.rpm
            cli/*.apk
            cli/PKGBUILD
            cli/APKBUILD
            cli/void-template
          generate_release_notes: true

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
