name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    strategy:
      matrix:
        board: [olimex-esp32-poe, wt32-eth01, generic-wifi]
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/zig-xtensa
          key: zig-xtensa-0.16.0-xtensa-9e3dcef9
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('firmware/sdkconfig.defaults', 'firmware/boards/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ hashFiles('firmware/sdkconfig.defaults', 'firmware/boards/**') }}-
            ccache-
      - name: Fetch Espressif Zig
        run: |
          [ -x .tools/zig-xtensa/zig ] && exit 0
          mkdir -p .tools/zig-xtensa
          curl -sSL -o zig-xtensa.tar.xz https://github.com/kassane/zig-espressif-bootstrap/releases/download/0.16.0-xtensa/zig-relsafe-x86_64-linux-musl-baseline.tar.xz
          echo "9e3dcef9d6f6d552df641a12addc9e443a69b7cbdad85492ec677acd55b7de9b  zig-xtensa.tar.xz" | sha256sum -c -
          tar -xJ -C .tools/zig-xtensa --strip-components=1 -f zig-xtensa.tar.xz && rm zig-xtensa.tar.xz
      - name: Tag must be on main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Release signing key
        env:
          KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          test -n "$KEY" || { echo "FIRMWARE_SIGNING_KEY secret missing: refusing to release an image boards would not accept"; exit 1; }
          printf '%s\n' "$KEY" > firmware/secure_boot_signing_key.pem
      - name: Build ${{ matrix.board }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          export ZIG="$PWD/.tools/zig-xtensa/zig"
          export PROJECT_VER="${GITHUB_REF_NAME}"
          cd firmware
          B="build-${{ matrix.board }}"
          idf.py -B "$B" -DSDKCONFIG="$B/sdkconfig" \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/${{ matrix.board }}.conf" build
      - name: Stage board files
        run: |
          B="firmware/build-${{ matrix.board }}"
          mkdir -p "fw/${{ matrix.board }}"
          cp "$B/flash_args" "$B/esp-hci-bridge.bin" "fw/${{ matrix.board }}/"
          mkdir -p "fw/${{ matrix.board }}/bootloader" "fw/${{ matrix.board }}/partition_table"
          cp "$B/bootloader/bootloader.bin" "fw/${{ matrix.board }}/bootloader/"
          cp "$B/partition_table/partition-table.bin" "fw/${{ matrix.board }}/partition_table/"
          cp "$B/ota_data_initial.bin" "fw/${{ matrix.board }}/" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-${{ matrix.board }}
          path: fw/

  site:
    needs: [firmware, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fw-*
          path: fw
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-repos
          path: repo
      - name: Assemble site for all boards
        run: |
          scripts/make-site.sh "${GITHUB_REF_NAME}" _site \
            olimex-esp32-poe=fw/olimex-esp32-poe \
            wt32-eth01=fw/wt32-eth01 \
            generic-wifi=fw/generic-wifi
          cp -r repo/alpine repo/deb repo/rpm repo/hcibridge.gpg repo/hcibridge.gpg.pub _site/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - run: zig build release -Dversion="${GITHUB_REF_NAME}"
      - name: Generate man page and completions
        run: zig build gen -Dversion="${GITHUB_REF_NAME}"
      - name: Package signing keys
        env:
          KEY: ${{ secrets.APK_SIGNING_KEY }}
          GPG: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          test -n "$KEY" || { echo "APK_SIGNING_KEY secret missing: refusing to release unsigned packages"; exit 1; }
          test -n "$GPG" || { echo "GPG_SIGNING_KEY secret missing: refusing to release unsigned packages"; exit 1; }
          printf '%s\n' "$KEY" > packaging/keys/heppu-esp-hci-bridge.rsa
          printf '%s\n' "$GPG" > packaging/keys/hcibridge.gpg
      - name: Install nfpm
        run: |
          NV=2.44.0
          curl -sSL -o nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NV}/nfpm_${NV}_Linux_x86_64.tar.gz"
          echo "1a12d47f104bdd5953d33bb1e97b369ffade9c429bfc070fd19977844100d3d2  nfpm.tgz" | sha256sum -c -
          tar xzf nfpm.tgz nfpm && rm nfpm.tgz
          sudo install nfpm /usr/local/bin/nfpm
      - name: Build packages and metadata
        run: |
          set -eu
          mkdir -p out
          VER="${GITHUB_REF_NAME#v}"
          export VERSION="$VER"
          cp zig-out/x86_64-linux-musl/hcibridge   out/hcibridge-x86_64-linux
          cp zig-out/aarch64-linux-musl/hcibridge  out/hcibridge-aarch64-linux
          cp zig-out/arm-linux-musleabihf/hcibridge out/hcibridge-armv7-linux
          cp zig-out/gen/hcibridge.1 zig-out/gen/hcibridge.bash zig-out/gen/_hcibridge zig-out/gen/hcibridge.fish out/
          # deb/rpm/apk for each arch from the one nfpm config
          set -- "x86_64-linux-musl amd64" "aarch64-linux-musl arm64" "arm-linux-musleabihf arm7"
          for pair in "$@"; do
            triple=${pair% *}; arch=${pair#* }
            mkdir -p dist
            cp "zig-out/$triple/hcibridge" dist/hcibridge
            for fmt in deb rpm apk; do
              PKG_ARCH="$arch" nfpm pkg -f packaging/nfpm.yaml -p "$fmt" -t out/
            done
          done
          # AUR PKGBUILD, Alpine APKBUILD and Void template with version + source checksum
          curl -sSfL -o src.tar.gz "https://github.com/heppu/esp-hci-bridge/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(sha256sum src.tar.gz | cut -d' ' -f1)
          SHA512=$(sha512sum src.tar.gz | cut -d' ' -f1)
          sed -e "s/@PKGVER@/$VER/" -e "s/@SHA256@/$SHA/" packaging/PKGBUILD.tmpl > out/PKGBUILD
          sed -e "s/@PKGVER@/$VER/" -e "s/@SHA512@/$SHA512/" packaging/APKBUILD.tmpl > out/APKBUILD
          sed -e "s/@PKGVER@/$VER/" -e "s/@SHA256@/$SHA/" packaging/void-template.tmpl > out/void-template
          ls -1 out/
      - name: Build the Alpine repository
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          KEY=heppu-esp-hci-bridge
          mkdir -p repo/alpine
          cp packaging/keys/$KEY.rsa.pub repo/alpine/
          for arch in x86_64 aarch64 armv7; do
            mkdir -p "repo/alpine/$arch"
            # apk fetches <name>-<version>.apk, whatever the file was called at build time
            cp "out/hcibridge_${VER}_${arch}.apk" "repo/alpine/$arch/hcibridge-${VER}.apk"
          done
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/repo/alpine:/r" -v "$PWD/packaging/keys:/keys:ro" alpine:3.22 \
            sh -c 'for d in /r/*/; do cd "$d" && apk index --keys-dir /keys -o unsigned.tar.gz *.apk; done'
          # abuild-sign without abuild: RSA-SHA1 over the index, prepended as its own tar
          for d in repo/alpine/*/; do
            ( cd "$d"
              openssl dgst -sha1 -sign "$OLDPWD/packaging/keys/$KEY.rsa" -out ".SIGN.RSA.$KEY.rsa.pub" unsigned.tar.gz
              tar -c --owner=0 --group=0 --numeric-owner ".SIGN.RSA.$KEY.rsa.pub" | head -c 1536 | gzip -9 > sig.tar.gz
              cat sig.tar.gz unsigned.tar.gz > APKINDEX.tar.gz
              rm -f sig.tar.gz unsigned.tar.gz ".SIGN.RSA.$KEY.rsa.pub" )
          done
      - name: Build the apt and rpm repositories
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y dpkg-dev apt-utils createrepo-c gnupg >/dev/null
          packaging/make-repos.sh out repo packaging/keys
      - name: Install from every repository in a container
        run: packaging/verify-repos.sh repo "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-repos
          path: repo/

  # The source recipes on the release page, built the way each distro builds them.
  recipes:
    needs: cli
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [arch, alpine, void]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli
          path: cli
      - run: packaging/verify-recipes.sh cli "${GITHUB_REF_NAME}" ${{ matrix.distro }}

  release:
    needs: [site, cli, recipes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli
          path: cli
      - name: Assemble assets
        run: |
          mkdir -p release
          # app image and bootloader differ per board, partition table and OTA data do not
          for b in olimex-esp32-poe wt32-eth01 generic-wifi; do
            cp "_site/firmware/$b/esp-hci-bridge.bin" "release/esp-hci-bridge-$b.bin"
            cp "_site/firmware/$b/bootloader.bin" "release/bootloader-$b.bin"
            for f in partition-table.bin ota_data_initial.bin; do
              [ -f "_site/firmware/$b/$f" ] || continue
              if [ -f "release/$f" ]; then cmp "_site/firmware/$b/$f" "release/$f"; else cp "_site/firmware/$b/$f" release/; fi
            done
          done
          cp cli/* release/
          chmod +x release/hcibridge-*
          # versionless copies so releases/latest/download/<file> always resolves
          VER="${GITHUB_REF_NAME#v}"
          for f in release/hcibridge_"$VER"_*.deb release/hcibridge_"$VER"_*.apk; do
            cp "$f" "${f/_${VER}_/_}"
          done
          for f in release/hcibridge-"$VER"-1.*.rpm; do
            cp "$f" "${f/-${VER}-1./.}"
          done
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Keeps aur.archlinux.org/packages/hcibridge on the released version.
  aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli
          path: cli
      - name: Generate .SRCINFO
        run: |
          mkdir aur && cp cli/PKGBUILD aur/
          docker run --rm -v "$PWD/aur:/w" archlinux:latest bash -euc '
            pacman -Sy --noconfirm --needed base-devel >/dev/null 2>&1
            useradd -m b && chown b /w
            su b -c "cd /w && makepkg --printsrcinfo > .SRCINFO"
            chown '"$(id -u)"' /w/.SRCINFO'
          cat aur/.SRCINFO
      - name: Push to the AUR
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          test -n "$KEY" || { echo "AUR_SSH_KEY secret missing, skipping"; exit 0; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone -q ssh://aur@aur.archlinux.org/hcibridge.git repo
          cp aur/PKGBUILD aur/.SRCINFO repo/
          cd repo
          git add PKGBUILD .SRCINFO
          git -c user.name="esp-hci-bridge release" -c user.email="henri.koski@bitbrewers.fi" commit -qm "hcibridge ${GITHUB_REF_NAME#v}" || { echo "AUR already current"; exit 0; }
          git push -q origin HEAD:master

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
